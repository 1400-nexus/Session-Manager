# RX-side session manager. Relative paths resolve against this file's
# directory, not the process working directory. Every key can be overridden
# by a NEXUS_-prefixed environment variable (see .env.example).

[paths]
staging_dir = "./staging"
output_dir = "./output"
journal_dir = "./journal"
run_dir = "./run"
socket_path = "./run/session-manager.sock"
lock_path = "./run/session-manager.lock"

[shm]
name = "nexus-rx"
arena_bytes = 268435456
slot_bytes = 4194304

[aggregation]
poll_interval_s = 1.0
stall_timeout_s = 8.0
# The UDS BlockDecoded stream is authoritative and sufficient on its own. The
# shm bitmap is only ever a redundant cross-check against it -- and until a
# receiver implementation actually writes that bitmap, every session diverges
# (bitmap_count stays 0 while the UDS count climbs) and the check is pure
# noise. Kept off until B confirms his receiver maintains the bitmap.
shm_crosscheck = false

# count = 0 means "supervise nothing" -- the C++ receiver binary lives in a
# different repo and will not exist here until it is built or mounted. ports
# must have at least `count` entries.
[receivers]
count = 0
ports = [9100, 9101, 9102]
binary_path = "./bin/nexus-receiver"

[purge]
# The SessionAuthority sweeps every open session on this interval and emits a
# PurgeSession for any that turned terminal (verified, hash_mismatch, or --
# the case only a timer catches -- a session that simply went silent).
sweep_interval_seconds = 5.0
# Wall-clock gap with no BlockDecoded after which an unfinished session is
# declared INCOMPLETE and purged. PLACEHOLDER: 60s is deliberately too-long
# rather than too-short. The defensible number needs A's sender pacing
# (rate_limit_bps + the stripe schedule) -- under heavy loss a tail block can
# sit at k-1 symbols for a long time while other blocks keep completing, and
# this must exceed that worst-case gap, not the gap between two packets.
stall_timeout_seconds = 60.0

[status]
refresh_interval_s = 0.5
# false (default) = auto-detect a terminal, which is correct under compose
# `tty: true`. Set true only for a container run WITHOUT a TTY whose status
# tables must still show up in `docker compose logs`; it forces rich to
# render as if attached, it does not disable rendering.
force_terminal = false

# fec.k / fec.n / fec.symbol_bytes are deliberately absent: they arrive
# per-session in the Manifest. Pinning them here would give a receiver that
# decodes correctly until someone retunes K on the TX side, then writes
# garbage that looks like packet loss.
